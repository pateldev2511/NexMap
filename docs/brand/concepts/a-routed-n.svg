<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="a-tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#121a33"/>
      <stop offset="1" stop-color="#070b17"/>
    </linearGradient>
    <linearGradient id="a-cable" x1="140" y1="390" x2="372" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7a5cff"/>
      <stop offset="0.5" stop-color="#2f6bff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="a-pulse" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#7cf3ff"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#a-tile)"/>
  <rect x="10" y="10" width="492" height="492" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
  <!-- the N: one cable, routed up, across and up again -->
  <path d="M152 388 V152 L360 360 V124" fill="none" stroke="url(#a-cable)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the two nodes the cable runs through -->
  <circle cx="152" cy="152" r="34" fill="#070b17" stroke="#ffffff" stroke-width="14"/>
  <circle cx="360" cy="360" r="34" fill="#070b17" stroke="#ffffff" stroke-width="14"/>
  <!-- signal on the link -->
  <circle cx="256" cy="256" r="40" fill="url(#a-pulse)"/>
  <circle cx="256" cy="256" r="11" fill="#ffffff"/>
</svg>
