<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">NexMap current editor preview</title>
  <desc id="desc">A preview of the NexMap local-first network infrastructure designer with library, canvas, inspector, validation, and isometric topology.</desc>
  <defs>
    <linearGradient id="chrome" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="canvas" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5f7fb"/>
      <stop offset="1" stop-color="#eef3f9"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <pattern id="grid" width="32" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0 32 8 16 16 0 8Z" fill="none" stroke="#dbe4ef" stroke-width="1"/>
    </pattern>
    <style>
      .ui{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .small{font-size:13px;fill:#64748b}
      .tiny{font-size:11px;fill:#64748b}
      .label{font-size:14px;fill:#1e293b;font-weight:600}
      .h{font-size:12px;fill:#64748b;font-weight:700;letter-spacing:.08em}
      .btn{fill:#fff;stroke:#d7dee8}
      .btnText{font-size:13px;fill:#334155}
      .muted{fill:#64748b}
      .line{stroke:#64748b;stroke-width:3;stroke-linecap:round;fill:none}
      .link{stroke:#64748b;stroke-width:4;stroke-linecap:round;fill:none}
      .warn{fill:#d97706}
      .ok{fill:#16a34a}
    </style>
  </defs>

  <rect width="1440" height="900" rx="28" fill="#e8eef6"/>
  <rect x="24" y="24" width="1392" height="852" rx="18" fill="url(#chrome)" filter="url(#softShadow)"/>

  <g class="ui">
