name: Feature request
description: Suggest an idea for NexMap
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Keep in mind NexMap is **local-first** — features that require a server,
        account, or sending data off the device are out of scope by design.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The user need or friction, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
